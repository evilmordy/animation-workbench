[package]
name = "awb-spike-llm"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "http2"] }
futures-util = "0.3"
keyring = "4"
url = "2"
thiserror = "2"
