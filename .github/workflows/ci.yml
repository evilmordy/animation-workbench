name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # rustsec/audit-check 会创建 check run。默认 GITHUB_TOKEN 是只读时，这一步在审计通过后仍失败，
    # 后面的 Playwright 被跳过。main 上 11-02 的 ubuntu 失败就是这个，重跑也不会好。
    permissions:
      contents: read
      checks: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: SEC-06 禁止 innerHTML
        shell: bash
        run: "! grep -rnE 'innerHTML|outerHTML|insertAdjacentHTML' src --include='*.ts' --include='*.vue'"
      - run: pnpm audit --prod --audit-level high
      - name: SEC-08 许可证检查
        run: node scripts/check-licenses.mjs
      - name: SEC-08 cargo audit
        if: runner.os == 'Linux'
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
      - run: pnpm build:runtime
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Playwright（运行时与 e2e）
        if: runner.os == 'Linux'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - run: pnpm tauri build --no-bundle
