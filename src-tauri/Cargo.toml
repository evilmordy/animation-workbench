[package]
name = "animation-workbench"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "animation_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-store = "2.5.0"
tauri-plugin-persisted-scope = "2.4.2"
tauri-plugin-opener = "2.7.2"
tokio = { version = "1.54.1", features = ["time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "http2"] }
futures-util = "0.3.34"
keyring = "4"
url = "2.5.8"
